# Lint (incl. gofmt via .golangci.yml formatters) runs through the official
# golangci-lint pre-commit hook; build and tests run in CI.
# See https://golangci-lint.run/usage/install/#pre-commit-hooks
repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint
